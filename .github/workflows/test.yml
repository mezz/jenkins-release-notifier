name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: release-notifier --help
      - run: python -m unittest discover -s tests -t . -v

  jenkins-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update
      - run: sudo apt-get install --yes groovy
      - run: groovy tests/jenkins/ReleaseNotifierStepTest.groovy
      - run: groovyc -d build/groovy Jenkinsfile vars/releaseNotifier.groovy

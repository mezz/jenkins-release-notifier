[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkins-release-notifier"
version = "0.2.0"
description = "GitHub release and Discord build notifications from Jenkins"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "mezz"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/mezz/jenkins-release-notifier"
Repository = "https://github.com/mezz/jenkins-release-notifier.git"
Issues = "https://github.com/mezz/jenkins-release-notifier/issues"

[project.scripts]
release-notifier = "release_notifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
